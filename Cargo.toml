[package]
name = "perfwork"
version = "0.1.0"
edition = "2021"
description = "Perfwork - Modern Perfboard, Stripboard & Breadboard CAD Designer"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
# Offscreen PNG rendering. These are already in eframe's tree under the glow feature; they
# are named directly here because the image export drives the painter itself.
egui_glow = "0.31"
glow = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement"] }
